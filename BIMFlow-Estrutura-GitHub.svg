 <linearGradient id="accent"><stop stop-color="#1f97c7"/><stop offset="1" stop-color="#60d2e5"/></linearGradient>
 <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#a4d7f4" stroke-opacity=".07"/></pattern>
 <filter id="shadow" x="-.1" y="-.1" width="1.2" height="1.3"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#001426" flood-opacity=".17"/></filter>
 <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#67d7ec"/></marker>
 <symbol id="folder" viewBox="0 0 24 24"><path d="M2 6V19h20V8H11L9 5H2Z" fill="#ddebf7" stroke="#8db2d1" stroke-width="1.2"/><path d="M2 9h20v10H2Z" fill="#eaf3fa"/></symbol>
 <symbol id="file" viewBox="0 0 24 24"><path d="M5 2h9l5 5v15H5Z" fill="#e7f4fa" stroke="#83b2cc"/><path d="M14 2v6h5M8 12h8M8 16h8" fill="none" stroke="#4593bb"/></symbol>
</defs>
