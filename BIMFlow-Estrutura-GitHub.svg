<rect x="538" y="294" width="362" height="361" rx="12" fill="#f3f7fb"/>
<g font-size="14" fill="#183f6d">
<use href="#folder" x="553" y="312" width="22" height="22"/><text x="584" y="329" font-weight="700">eletrica-2024-v1.zip</text>
