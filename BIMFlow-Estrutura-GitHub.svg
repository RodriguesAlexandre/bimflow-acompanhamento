<text x="1014" y="642" fill="#94641d" font-size="11">Download e sincronização ainda não implementados</text>
<rect x="996" y="675" width="362" height="144" rx="12" fill="#eaf4fb"/>
<text x="1014" y="701" fill="#148cc2" font-size="11" font-weight="700" letter-spacing="1">PRÓXIMA IMPLEMENTAÇÃO</text>
<text x="1014" y="729" fill="#183f6d" font-size="13">Baixar, conferir e extrair a revisão.</text>
<text x="1014" y="753" fill="#60758b" font-size="12">Validar integridade antes de substituir o cache.</text>
<text x="1014" y="775" fill="#60758b" font-size="12">Unificar catálogos após homologar os</text>
<text x="1014" y="797" fill="#60758b" font-size="12">importadores de cada disciplina.</text>
