<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1120" viewBox="0 0 1440 1120" role="img" aria-labelledby="title desc">
<title id="title">BIMFlow: estrutura proposta para GitHub e distribuição da biblioteca de elétrica</title>
<desc id="desc">No GitHub, catalogos/2024/eletrica guarda catalogo.json, relatório e Imagens. A release eletrica-2024-v1.zip contém o mesmo JSON, relatório, Imagens e Sistemas com o arquivo RVT. Uma sincronização futura extrairá o pacote localmente para uso no Revit. Outras disciplinas estão planejadas.</desc>
<defs>
