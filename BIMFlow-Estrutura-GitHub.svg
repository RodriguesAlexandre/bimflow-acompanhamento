<rect x="538" y="675" width="362" height="144" rx="12" fill="#eaf4fb"/>
<text x="556" y="701" fill="#148cc2" font-size="11" font-weight="700" letter-spacing="1">IDENTIDADE DA REVISÃO</text>
<text x="556" y="729" fill="#183f6d" font-size="13">Versão do Revit + disciplina + revisão.</text>
<text x="556" y="753" fill="#60758b" font-size="12">Salvar e incluir o RVT correspondente.</text>
<text x="556" y="775" fill="#60758b" font-size="12">Não misturar JSON e modelo de revisões</text>
<text x="556" y="797" fill="#60758b" font-size="12">diferentes no mesmo pacote.</text>
