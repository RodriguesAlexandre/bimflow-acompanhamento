<text x="56" y="104" fill="white" font-size="36" font-weight="700">Do repositório ao Revit.</text>
<text x="56" y="137" fill="#bdd4e7" font-size="16">Estrutura proposta para distribuir o piloto de elétrica e replicar nas demais disciplinas.</text>
<rect x="1121" y="52" width="261" height="34" rx="17" fill="#ffffff12" stroke="#ffffff30"/>
<text x="1252" y="74" fill="#c8eaf6" font-size="12" font-weight="600" text-anchor="middle">GITHUB E SINCRONIZAÇÃO: PLANEJADOS</text>
