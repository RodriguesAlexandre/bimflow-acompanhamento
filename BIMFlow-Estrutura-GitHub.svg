<text x="98" y="701" fill="#148cc2" font-size="11" font-weight="700" letter-spacing="1">CONTEÚDO VERSIONADO</text>
<text x="98" y="729" fill="#183f6d" font-size="13">JSON e imagens descrevem a mesma revisão.</text>
<text x="98" y="753" fill="#60758b" font-size="12">O RVT atual tem cerca de 156 MiB.</text>
<text x="98" y="775" fill="#60758b" font-size="12">Distribuir o binário via release, em vez de</text>
<text x="98" y="797" fill="#60758b" font-size="12">incluí-lo no Git comum acima de 100 MiB.</text>
