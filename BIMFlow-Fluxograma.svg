<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 750" role="img" aria-labelledby="flow-title flow-desc"><title id="flow-title">Fluxograma de evolução BIMFlow: piloto de elétrica</title><desc id="flow-desc">Etapas um a seis implementadas. Etapa sete em homologação. Após validação, etapas oito e nove: distribuir a biblioteca e expandir disciplinas. A publicação deste site é independente da distribuição do conteúdo Revit.</desc><defs><linearGradient id="flow-bg" x2="1" y2="1"><stop stop-color="#102e50"/><stop offset="1" stop-color="#1d5075"/></linearGradient><pattern id="flow-grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#fff" stroke-opacity=".045"/></pattern><marker id="flow-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#83c9df"/></marker></defs><rect width="1100" height="750" rx="22" fill="url(#flow-bg)"/><rect width="1100" height="750" rx="22" fill="url(#flow-grid)"/><g font-family="Segoe UI,Arial,sans-serif"><text x="40" y="44" fill="#83d9e9" font-size="12" letter-spacing="2">P. AVELAR · BIMFLOW · PILOTO DE ELÉTRICA</text><text x="40" y="75" fill="white" font-size="23" font-weight="700">Da preparação à escala corporativa</text><g fill="none" stroke="#83c9df" stroke-width="2" marker-end="url(#flow-arrow)"><path d="M340 165H386"/><path d="M700 165H746"/><path d="M910 230V276"/><path d="M760 355H714"/><path d="M400 355H354"/><path d="M190 420V486"/><path d="M340 565H386" stroke-dasharray="6 5"/><path d="M700 565H746" stroke-dasharray="6 5"/></g><text x="270" y="467" fill="#f4d99d" font-size="12">Porta de qualidade: concluir testes antes de distribuir</text><g><rect x="40" y="100" width="300" height="130" rx="14" fill="#ffffff" fill-opacity=".07" stroke="#70d4b2" stroke-opacity=".7"/><circle cx="70" cy="132" r="16" fill="#70d4b2"/><text x="70" y="136" text-anchor="middle" fill="#12334f" font-size="12" font-weight="700">01</text><text x="97" y="136" fill="#70d4b2" font-size="10" letter-spacing="1">IMPLEMENTADO</text><text x="60" y="176" fill="white" font-size="20" font-weight="600">Mapear elétrica</text><text x="60" y="204" fill="#c1d8e8" font-size="13">Categorias e critérios</text></g><g><rect x="400" y="100" width="300" height="130" rx="14" fill="#ffffff" fill-opacity=".07" stroke="#70d4b2" stroke-opacity=".7"/><circle cx="430" cy="132" r="16" fill="#70d4b2"/><text x="430" y="136" text-anchor="middle" fill="#12334f" font-size="12" font-weight="700">02</text><text x="457" y="136" fill="#70d4b2" font-size="10" letter-spacing="1">IMPLEMENTADO</text><text x="420" y="176" fill="white" font-size="20" font-weight="600">Exportar famílias</text><text x="420" y="204" fill="#c1d8e8" font-size="13">Sistemas e carregáveis</text></g><g><rect x="760" y="100" width="300" height="130" rx="14" fill="#ffffff" fill-opacity=".07" stroke="#70d4b2" stroke-opacity=".7"/><circle cx="790" cy="132" r="16" fill="#70d4b2"/><text x="790" y="136" text-anchor="middle" fill="#12334f" font-size="12" font-weight="700">03</text><text x="817" y="136" fill="#70d4b2" font-size="10" letter-spacing="1">IMPLEMENTADO</text><text x="780" y="176" fill="white" font-size="20" font-weight="600">Mapear JSON</text><text x="780" y="204" fill="#c1d8e8" font-size="13">Identidade e metadados</text></g><g><rect x="760" y="290" width="300" height="130" rx="14" fill="#ffffff" fill-opacity=".07" stroke="#70d4b2" stroke-opacity=".7"/><circle cx="790" cy="322" r="16" fill="#70d4b2"/><text x="790" y="326" text-anchor="middle" fill="#12334f" font-size="12" font-weight="700">04</text><text x="817" y="326" fill="#70d4b2" font-size="10" letter-spacing="1">IMPLEMENTADO</text><text x="780" y="366" fill="white" font-size="20" font-weight="600">Imagens e vistas</text><text x="780" y="394" fill="#c1d8e8" font-size="13">Miniaturas e pacotes</text></g><g><rect x="400" y="290" width="300" height="130" rx="14" fill="#ffffff" fill-opacity=".07" stroke="#70d4b2" stroke-opacity=".7"/><circle cx="430" cy="322" r="16" fill="#70d4b2"/><text x="430" y="326" text-anchor="middle" fill="#12334f" font-size="12" font-weight="700">05</text><text x="457" y="326" fill="#70d4b2" font-size="10" letter-spacing="1">IMPLEMENTADO</text><text x="420" y="366" fill="white" font-size="20" font-weight="600">Painel BIMFlow</text><text x="420" y="394" fill="#c1d8e8" font-size="13">Busca e filtros múltiplos</text></g><g><rect x="40" y="290" width="300" height="130" rx="14" fill="#ffffff" fill-opacity=".07" stroke="#70d4b2" stroke-opacity=".7"/><circle cx="70" cy="322" r="16" fill="#70d4b2"/><text x="70" y="326" text-anchor="middle" fill="#12334f" font-size="12" font-weight="700">06</text><text x="97" y="326" fill="#70d4b2" font-size="10" letter-spacing="1">IMPLEMENTADO</text><text x="60" y="366" fill="white" font-size="20" font-weight="600">Importar conteúdo</text><text x="60" y="394" fill="#c1d8e8" font-size="13">Fluxo unificado e validações</text></g><g><rect x="40" y="500" width="300" height="130" rx="14" fill="#ffffff" fill-opacity=".07" stroke="#f3c870" stroke-opacity=".7"/><circle cx="70" cy="532" r="16" fill="#f3c870"/><text x="70" y="536" text-anchor="middle" fill="#12334f" font-size="12" font-weight="700">07</text><text x="97" y="536" fill="#f3c870" font-size="10" letter-spacing="1">EM VALIDAÇÃO</text><text x="60" y="576" fill="white" font-size="20" font-weight="600">Homologar piloto</text><text x="60" y="604" fill="#c1d8e8" font-size="13">Lote, legendas e reimportação</text></g><g><rect x="400" y="500" width="300" height="130" rx="14" fill="#ffffff" fill-opacity=".07" stroke="#8dbfe6" stroke-opacity=".7"/><circle cx="430" cy="532" r="16" fill="#8dbfe6"/><text x="430" y="536" text-anchor="middle" fill="#12334f" font-size="12" font-weight="700">08</text><text x="457" y="536" fill="#8dbfe6" font-size="10" letter-spacing="1">PLANEJADO</text><text x="420" y="576" fill="white" font-size="20" font-weight="600">Distribuir biblioteca</text><text x="420" y="604" fill="#c1d8