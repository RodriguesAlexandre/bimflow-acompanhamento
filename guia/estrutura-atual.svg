<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="660" viewBox="0 0 1140 660"><defs><pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#ffffff06"/></pattern><linearGradient id="bg"><stop stop-color="#123354"/><stop offset="1" stop-color="#1c4b72"/></linearGradient></defs><rect width="1140" height="660" rx="16" fill="url(#bg)"/><rect width="1140" height="660" rx="16" fill="url(#grid)"/><text x="35" y="36" font-family="Segoe UI,Arial" font-size="11" fill="#72d2eb" font-weight="600">BIMFLOW · BIBLIOTECA CORPORATIVA</text><text x="35" y="72" font-family="Segoe UI,Arial" font-size="25" fill="white" font-weight="600">Código, acervo e cache com funções separadas.</text><rect x="30" y="98" width="650" height="522" rx="14" fill="#ffffff08" stroke="#ffffff20"/><rect x="705" y="98" width="405" height="247" rx="14" fill="#ffffff0a" stroke="#ffffff20"/><rect x="705" y="370" width="405" height="250" rx="14" fill="#ffffff0a" stroke="#ffffff20"/><text x="54" y="130" font-family="Segoe UI,Arial" font-size="10" fill="#82d6ed" font-weight="600">REPOSITÓRIO PRIVADO</text><text x="54" y="162" font-family="Segoe UI,Arial" font-size="21" fill="white" font-weight="600">bimflow-biblioteca/</text><text x="58" y="196" font-family="Segoe UI,Arial" font-size="16" fill="#e2eff8" font-weight="400">├── biblioteca.json</text><text x="76" y="217" font-family="Segoe UI,Arial" font-size="11" fill="#8cb8d6" font-weight="400">Índice das revisões ativas</text><text x="58" y="234" font-family="Segoe UI,Arial" font-size="16" fill="#e2eff8" font-weight="600">├── ELÉTRICA/2024/</text><text x="58" y="267" font-family="Segoe UI,Arial" font-size="16" fill="#e2eff8" font-weight="400">│   ├── catalogo-carregaveis.json</text><text x="58" y="296" font-family="Segoe UI,Arial" font-size="16" fill="#e2eff8" font-weight="400">│   ├── catalogo-sistemas.json</text><text x="58" y="325" font-family="Segoe UI,Arial" font-size="16" fill="#e2eff8" font-weight="400">│   └── catalogo-vistas.json</text><text x="58" y="363" font-family="Segoe UI,Arial" font-size="16" fill="#e2eff8" font-weight="600">├── ARQUITETURA/2024/</text><text x="76" y="384" font-family="Segoe UI,Arial" font-size="11" fill="#8cb8d6" font-weight="400">Mesmos três catálogos</text><text x="58" y="401" font-family="Segoe UI,Arial" font-size="16" fill="#e2eff8" font-weight="600">└── OUTRAS DISCIPLINAS/2024/</text><text x="76" y="422" font-family="Segoe UI,Arial" font-size="11" fill="#8cb8d6" font-weight="400">Estrutura prevista para expansão</text><path d="M54 451H655" stroke="#ffffff20"/><text x="54" y="481" font-family="Segoe UI,Arial" font-size="10" fill="#82d6ed" font-weight="600">PASTAS LÓGICAS DO ACERVO</text><text x="54" y="512" font-family="Segoe UI,Arial" font-size="14" fill="#e3f0f8" font-weight="600">FAMÍLIAS CARREGÁVEIS · FAMÍLIAS SISTEMA</text><text x="54" y="541" font-family="Segoe UI,Arial" font-size="14" fill="#e3f0f8" font-weight="600">IMAGENS · RELATÓRIOS</text><text x="54" y="575" font-family="Segoe UI,Arial" font-size="11" fill="#92bed9" font-weight="400">O manifesto preserva os caminhos e aponta os assets da Release.</text><text x="728" y="130" font-family="Segoe UI,Arial" font-size="10" fill="#82d6ed" font-weight="600">RELEASES · ARQUIVOS PESADOS</text><text x="728" y="162" font-family="Segoe UI,Arial" font-size="20" fill="white" font-weight="600">Uma revisão por publicação</text><text x="733" y="197" font-family="Segoe UI,Arial" font-size="14" fill="#d0e6f5" font-weight="400">↳ manifesto.json</text><text x="733" y="229" font-family="Segoe UI,Arial" font-size="14" fill="#d0e6f5" font-weight="400">↳ metadados.zip</text><text x="733" y="261" font-family="Segoe UI,Arial" font-size="14" fill="#d0e6f5" font-weight="400">↳ Arquivos RFA das famílias</text><text x="733" y="293" font-family="Segoe UI,Arial" font-size="14" fill="#d0e6f5" font-weight="400">↳ Arquivo RVT dos sistemas e vistas</text><text x="728" y="402" font-family="Segoe UI,Arial" font-size="10" fill="#82d6ed" font-weight="600">COMPUTADOR DO PROJETISTA</text><text x="728" y="434" font-family="Segoe UI,Arial" font-size="20" fill="white" font-weight="600">Cache local verificado</text><text x="730" y="470" font-family="Segoe UI,Arial" font-size="14" fill="#d0e6f5" font-weight="400">%LOCALAPPDATA%/BIMFlow/</text><text x="730" y="498" font-family="Segoe UI,Arial" font-size="17" fill="white" font-weight="600">BibliotecaOnline/</text><text x="730" y="535" font-family="Segoe UI,Arial" font-size="12" fill="#a7c9df" font-weight="400">Catálogo e miniaturas na atualização.</text><text x="730" y="563" font-family="Segoe UI,Arial" font-size="12" fill="#a7c9df" font-weight="400">RFA ou RVT quando o conteúdo é solicitado.</text><text x="730" y="591" font-family="Segoe UI,Arial" font-size="12" fill="#a7c9df" font-weight="400">SHA-256 confere a integridade dos arquivos.</text><path d="M689 225h9m-4-4 4 4-4 4" fill="none" stroke="#7ac6df" stroke-width="2"/><path d="M910 350v13m-5-5 5 5 5-5" fill="none" stroke="#7ac6df" stroke-width="2"/></svg>